name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: docker run --rm -v "$PWD:/workspace" -w /workspace bufbuild/buf:latest lint
      - name: Check breaking changes
        if: github.event_name == 'pull_request'
        run: |
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            base_major="$(git show origin/main:package.json | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => process.stdout.write(String(Number(JSON.parse(s).version.split(".")[0]))))')"
            current_major="$(node -p 'Number(require("./package.json").version.split(".")[0])')"
            if [ "$current_major" -gt "$base_major" ]; then
              docker run --rm -v "$PWD:/workspace" -w /workspace bufbuild/buf:latest breaking --against '.git#ref=origin/main' --config '{"version":"v2","modules":[{"path":"proto"}],"deps":["buf.build/bufbuild/protovalidate","buf.build/googleapis/googleapis"],"breaking":{"use":["FILE"],"except":["FILE_SAME_GO_PACKAGE"]}}'
            else
              docker run --rm -v "$PWD:/workspace" -w /workspace bufbuild/buf:latest breaking --against '.git#ref=origin/main'
            fi
          else
            echo "origin/main not found; skipping breaking check"
          fi
      - run: docker run --rm -v "$PWD:/workspace" -w /workspace bufbuild/buf:latest generate
      - run: npm run test:wire
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go mod tidy
      - run: git diff --exit-code
