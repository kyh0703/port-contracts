  RuntimeAuthorization owner = 1 [(buf.validate.field).required = true];
  string intent_id = 2 [(buf.validate.field).string.uuid = true];
  string reason = 3 [(buf.validate.field).string = {min_len: 1 max_len: 500}];
  string ended_by = 4 [(buf.validate.field).string = {in: ["ai", "system"]}];
}

message EndRuntimeResponse {
  RuntimeProjection projection = 1 [(buf.validate.field).required = true];
}

message RecordRuntimeUsageRequest {
  option (buf.validate.message).cel = {
    id: "runtime_usage.purpose"
    message: "intent requires main or helper control; capture and late facts require origin receipt authority"
    expression: "(this.kind == 'intent' && (has(this.owner) || has(this.helper_authorization))) || (this.kind != 'intent' && has(this.receipt))"
  };
  oneof authority {
    option (buf.validate.oneof).required = true;
    RuntimeAuthorization owner = 1;
    RuntimeReceiptAuthorization receipt = 2;
    RuntimeHelperAuthorization helper_authorization = 18;
  }
  string kind = 3 [(buf.validate.field).string = {in: ["intent", "capture", "execution_close", "llm_reconciliation"]}];
  string fact_id = 4 [(buf.validate.field).string = {min_len: 1 max_len: 512}];
  optional string paid_attempt_id = 5 [(buf.validate.field).string = {min_len: 1 max_len: 256}];
  optional string provider_segment_id = 6 [(buf.validate.field).string = {min_len: 1 max_len: 512}];
  optional string delta_id = 7 [(buf.validate.field).string = {min_len: 1 max_len: 256}];
  string completeness = 8 [(buf.validate.field).string = {in: ["pending", "complete", "partial", "unknown"]}];
  // Preserve the existing CloudEvent and its canonical ID. Its sessionid stays
  // the original audit execution ID, not the recovering interaction session.
  optional string cloud_event_json = 9 [(buf.validate.field).string.max_bytes = 65536];
  optional string usage_kind = 10 [(buf.validate.field).string = {in: ["llm", "stt", "tts"]}];
  optional string provider = 11 [(buf.validate.field).string = {min_len: 1 max_len: 128}];
  optional string model = 12 [(buf.validate.field).string = {min_len: 1 max_len: 512}];
  repeated string expected_meters = 13 [(buf.validate.field).repeated = {
    max_items: 32 unique: true
    items: {string: {min_len: 1 max_len: 64}}
  }];
  optional string request_attempt_id = 14 [(buf.validate.field).string = {min_len: 1 max_len: 128}];
  LlmAuditUsage usage = 15;
  optional string actual_model = 16 [(buf.validate.field).string = {min_len: 1 max_len: 512}];
  optional string provider_request_id = 17 [(buf.validate.field).string = {min_len: 1 max_len: 512}];
}

message RecordRuntimeUsageResponse {
  string fact_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 512}];
  bool recorded = 2;
  bool duplicate = 3;
  string completeness = 4 [(buf.validate.field).string = {in: ["pending", "complete", "partial", "unknown"]}];
  string disposition = 5 [(buf.validate.field).string = {in: ["retained", "duplicate", "erased"]}];
}

message ReadRuntimeKnowledgeRequest {
  RuntimeAuthorization owner = 1 [(buf.validate.field).required = true];
  string node_id = 2 [(buf.validate.field).string = {min_len: 1 max_len: 256}];
  string tool_reference = 3 [(buf.validate.field).string = {min_len: 1 max_len: 256}];
  string query = 4 [(buf.validate.field).string = {min_len: 1 max_bytes: 16000}];
  optional uint32 limit = 5 [(buf.validate.field).uint32 = {gte: 1 lte: 100}];
}

message ReadRuntimeKnowledgeResponse {
  // The unchanged search result ABI after the API rechecks current ownership.
  string result_json = 1 [(buf.validate.field).string = {min_bytes: 1 max_bytes: 1048576}];
}
