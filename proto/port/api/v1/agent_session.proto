syntax = "proto3";

package port.api.v1;

import "buf/validate/validate.proto";
import "port/api/v1/voice_runtime.proto";

option go_package = "github.com/kyh0703/port-contracts/v3/gen/go/port/api/v1;apiv1";

// AgentSessionService is the worker-only API boundary for LiveKit jobs.
service AgentSessionService {
  rpc BootstrapPublished(BootstrapPublishedRequest) returns (BootstrapPublishedResponse);
}

message BootstrapRequest {
  oneof admission {
    option (buf.validate.oneof).required = true;
    string webrtc_ticket = 1 [(buf.validate.field).string.min_len = 1];
    SipBootstrapContext sip = 2;
  }
}

message SipBootstrapContext {
  string job_id = 1 [(buf.validate.field).string.min_len = 1];
  string dispatch_id = 2 [(buf.validate.field).string.min_len = 1];
  string room_name = 3 [(buf.validate.field).string.min_len = 1];
  string participant_identity = 4 [(buf.validate.field).string.min_len = 1];
  string trunk_id = 5 [(buf.validate.field).string.min_len = 1];
  string trunk_phone_number = 6 [(buf.validate.field).string.min_len = 1];
  string call_id_full = 7 [(buf.validate.field).string.min_len = 1];
}

// published_id is the only execution identity accepted by a runtime session.
message BootstrapPublishedRequest {
  BootstrapRequest admission = 1 [(buf.validate.field).required = true];
  string conversation_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string session_id = 3 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string published_id = 4 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string contract_revision = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.const = "execution-publication-2026-08-11-r1"
  ];
}

message BootstrapPublishedResponse {
  option (buf.validate.message).oneof = {
    fields: ["agent", "orchestration"]
    required: true
  };
  option (buf.validate.message).oneof = {
    fields: ["voice_runtime", "text_runtime"]
    required: true
  };

  string contract_revision = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.const = "execution-publication-2026-08-11-r1"
  ];
  string conversation_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string session_id = 3 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string published_id = 4 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];

  oneof execution {
    option (buf.validate.oneof).required = true;
    PublishedAgentExecution agent = 5;
    PublishedOrchestrationExecution orchestration = 6;
  }
  oneof runtime {
    option (buf.validate.oneof).required = true;
    CallRuntimeSnapshot voice_runtime = 7;
    TextRuntimeSnapshot text_runtime = 8;
  }
  AgentGlobalActions global_actions = 9 [(buf.validate.field).required = true];
}

message PublishedAgentExecution {
  PublishedAgentRuntime runtime = 1 [(buf.validate.field).required = true];
}

message PublishedOrchestrationExecution {
  option (buf.validate.message).oneof = {
    fields: ["supervisor", "handoff"]
    required: true
  };
  option (buf.validate.message).cel = {
    id: "published_orchestration_execution.mode_snapshot"
    message: "mode must match the selected publication topology"
    expression: "(this.mode == 1 && has(this.supervisor)) || (this.mode == 2 && has(this.handoff))"
  };

  OrchestrationMode mode = 1 [(buf.validate.field).required = true, (buf.validate.field).enum = {defined_only: true not_in: 0}];
  repeated PublishedAgentRuntime agent_runtimes = 2 [(buf.validate.field).repeated.min_items = 2];
  PublishedSupervisorSnapshot supervisor = 3;
  PublishedHandoffSnapshot handoff = 4;
}

message PublishedAgentRuntime {
  string agent_published_id = 1 [(buf.validate.field).string.min_len = 1];
  LlmRuntime llm_worker = 2 [(buf.validate.field).required = true];
  AgentInstructions instructions = 3 [(buf.validate.field).required = true];
  ContextPolicy context_policy = 4 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
  repeated NodeToolMetadata tools = 5;
  repeated McpServerRuntime mcp_servers = 6;
  string greeting = 7;
  string knowledge_revision_id = 8;
  repeated ApiToolRuntime api_tool_runtimes = 9;
  string knowledge_retrieval_capability = 10;
}

message PublishedSupervisorSnapshot {
  string supervisor_agent_published_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated PublishedSupervisorSpecialist specialists = 2 [(buf.validate.field).repeated.min_items = 1];
}

message PublishedSupervisorSpecialist {
  string relation_id = 1 [(buf.validate.field).string.min_len = 1];
  string target_agent_published_id = 2 [(buf.validate.field).string.min_len = 1];
  string route_description = 3 [(buf.validate.field).string.min_len = 1];
  ContextPolicy context_policy = 4 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
}

message PublishedHandoffSnapshot {
  string entry_agent_published_id = 1 [(buf.validate.field).string.min_len = 1];
  uint32 max_handoff_depth = 2 [(buf.validate.field).uint32.gt = 0];
  repeated PublishedHandoffRoute routes = 3 [(buf.validate.field).repeated.min_items = 1];
}

message PublishedHandoffRoute {
  string transition_id = 1 [(buf.validate.field).string.min_len = 1];
  string source_agent_published_id = 2 [(buf.validate.field).string.min_len = 1];
  string target_agent_published_id = 3 [(buf.validate.field).string.min_len = 1];
  string routing_description = 4 [(buf.validate.field).string.min_len = 1];
  ContextPolicy context_policy = 5 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
  string announcement = 6;
}

message TextRuntimeSnapshot {
  string transport = 1 [(buf.validate.field).string.const = "text_stream"];
  string room_name = 2 [(buf.validate.field).string.min_len = 1];
  string participant_identity = 3 [(buf.validate.field).string.min_len = 1];
  uint32 idle_timeout_seconds = 4 [(buf.validate.field).uint32.gt = 0];
  uint32 max_session_duration_seconds = 5 [(buf.validate.field).uint32.gt = 0];
}

message CallRuntimeSnapshot {
  SttRuntime stt = 1 [(buf.validate.field).required = true];
  TtsRuntime tts = 2 [(buf.validate.field).required = true];
  BackgroundAudioRuntime background_audio = 3 [(buf.validate.field).required = true];
  DtmfInputRuntime dtmf = 4 [(buf.validate.field).required = true];
  TransportRuntime transport = 5 [(buf.validate.field).required = true];
  VadRuntime vad = 6 [(buf.validate.field).required = true];
  SpeechPolicyRuntime speech_policy = 7 [(buf.validate.field).required = true];
  CallLimitsRuntime limits = 8 [(buf.validate.field).required = true];
}

enum CallTransportSource {
  CALL_TRANSPORT_SOURCE_UNSPECIFIED = 0;
  CALL_TRANSPORT_SOURCE_WEBRTC = 1;
  CALL_TRANSPORT_SOURCE_SIP = 2;
  CALL_TRANSPORT_SOURCE_TEXT_STREAM = 3;
}

message TransportRuntime {
  CallTransportSource source = 1 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
  string room_name = 2 [(buf.validate.field).string.min_len = 1];
  string caller_participant_identity = 3 [(buf.validate.field).string.min_len = 1];
}

enum NoiseCancellationMode {
  NOISE_CANCELLATION_MODE_UNSPECIFIED = 0;
  NOISE_CANCELLATION_MODE_OFF = 1;
  NOISE_CANCELLATION_MODE_STANDARD = 2;
  NOISE_CANCELLATION_MODE_STRONG = 3;
}

message VadRuntime {
  NoiseCancellationMode noise_cancellation = 1 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
  optional double recognition_sensitivity = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).double = {gte: 0.5 lte: 0.75}
  ];
}

message SpeechPolicyRuntime {
  optional double response_speed = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).double = {gte: 0 lte: 1}
  ];
  optional bool allow_interruptions = 2 [(buf.validate.field).required = true];
}

message CallLimitsRuntime {
  uint32 dial_wait_time_seconds = 1 [(buf.validate.field).uint32 = {gte: 10 lte: 90}];
  uint32 max_call_duration_seconds = 2 [(buf.validate.field).uint32 = {gte: 60 lte: 900}];
  uint32 no_answer_timeout_seconds = 3 [(buf.validate.field).uint32 = {gte: 10 lte: 300}];
}

enum BackgroundAudioPreset {
  BACKGROUND_AUDIO_PRESET_UNSPECIFIED = 0;
  BACKGROUND_AUDIO_PRESET_NONE = 1;
  BACKGROUND_AUDIO_PRESET_CAFE = 2;
  BACKGROUND_AUDIO_PRESET_OFFICE = 3;
  BACKGROUND_AUDIO_PRESET_CONTACT_CENTER = 4;
  BACKGROUND_AUDIO_PRESET_LIBRARY = 5;
}

message BackgroundAudioRuntime {
  BackgroundAudioPreset preset = 1 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
  optional double volume = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).double = {gte: 0 lte: 1}
  ];
}

message DtmfInputRuntime {
  uint32 timeout_seconds = 1 [(buf.validate.field).uint32 = {gte: 1 lte: 10}];
  optional string end_key = 2 [(buf.validate.field).string.pattern = "^[0-9#*]$"];
}

message AgentInstructions {
  string system_prompt = 1 [(buf.validate.field).string.min_len = 1];
  repeated string guardrails = 2;
}

enum OrchestrationMode {
  ORCHESTRATION_MODE_UNSPECIFIED = 0;
  ORCHESTRATION_MODE_SUPERVISOR = 1;
  ORCHESTRATION_MODE_HANDOFF = 2;
}

message NodeToolMetadata {
  string tool_id = 1 [(buf.validate.field).string.min_len = 1];
  string kind = 2 [
    (buf.validate.field).string.in = "mcp",
    (buf.validate.field).string.in = "api"
  ];
  string name = 3 [(buf.validate.field).string.min_len = 1];
  string description = 4;
  oneof metadata {
    McpToolMetadata mcp = 5;
    ApiToolMetadata api = 6;
  }
}

enum ContextPolicy {
  CONTEXT_POLICY_UNSPECIFIED = 0;
  CONTEXT_POLICY_NONE = 1;
  CONTEXT_POLICY_CONVERSATION = 2;
}

message McpToolMetadata {
  string server_name = 1 [(buf.validate.field).string.min_len = 1];
  string transport = 2 [
    (buf.validate.field).string.in = "sse",
    (buf.validate.field).string.in = "streamable-http"
  ];
  string url = 3 [(buf.validate.field).string.min_len = 1];
}

message ApiToolMetadata {
  string method = 1 [(buf.validate.field).string.min_len = 1];
  string url = 2 [(buf.validate.field).string.min_len = 1];
  string request_schema_json = 3;
  string response_schema_json = 4;
}

// Short-lived execution credentials for API tools, scoped to the bootstrap lease.
message ApiToolRuntime {
  string tool_id = 1 [(buf.validate.field).string.min_len = 1];
  map<string, string> headers = 2;
}

message AgentGlobalActions {
  TransferToHumanAction transfer_to_human = 1;
  EndCallAction end_call = 2;
}

message TransferToHumanAction {
  bool enabled = 1;
  // Empty when disabled. SIP destination for the warm transfer.
  string sip_call_to = 2;
  string hold_phrase = 3;
  int32 ringing_timeout_ms = 4;
}

message EndCallAction {
  bool enabled = 1;
  string closing_phrase = 2;
  // Ask once before hanging up instead of ending immediately.
  bool confirm = 3;
}

message McpServerRuntime {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string transport = 2 [(buf.validate.field).string.in = "sse", (buf.validate.field).string.in = "streamable-http"];
  string url = 3 [(buf.validate.field).string.min_len = 1];
  map<string, string> headers = 4;
}
