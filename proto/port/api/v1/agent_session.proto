syntax = "proto3";

package port.api.v1;

import "buf/validate/validate.proto";
import "port/api/v1/runtime_identity.proto";
import "port/api/v1/voice_runtime.proto";

option go_package = "github.com/kyh0703/port-contracts/v4/gen/go/port/api/v1;apiv1";

// ExecutionSessionService is the worker-only API boundary for LiveKit jobs.
service ExecutionSessionService {
  rpc BootstrapPublished(BootstrapPublishedRequest) returns (BootstrapPublishedResponse);
  rpc CommandSipTransfer(CommandSipTransferRequest) returns (CommandSipTransferResponse);
  rpc RecordLlmRequestStarted(RecordLlmRequestStartedRequest) returns (RecordLlmRequestStartedResponse);
  rpc RecordLlmRequestTerminal(RecordLlmRequestTerminalRequest) returns (RecordLlmRequestTerminalResponse);
  rpc CommandFormCollection(CommandFormCollectionRequest) returns (CommandFormCollectionResponse);
  rpc PrepareRuntimeAttempt(PrepareRuntimeAttemptRequest) returns (PrepareRuntimeAttemptResponse);
  rpc RecoverRuntime(RecoverRuntimeRequest) returns (RecoverRuntimeResponse);
  rpc RenewRuntimeLease(RenewRuntimeLeaseRequest) returns (RenewRuntimeLeaseResponse);
  rpc ActivateRuntime(ActivateRuntimeRequest) returns (ActivateRuntimeResponse);
  rpc CommitRuntimeCheckpoint(CommitRuntimeCheckpointRequest) returns (CommitRuntimeCheckpointResponse);
  rpc ExecuteRuntimeOperation(ExecuteRuntimeOperationRequest) returns (ExecuteRuntimeOperationResponse);
  rpc GetRuntimeOperation(GetRuntimeOperationRequest) returns (GetRuntimeOperationResponse);
  rpc RecordRuntimeReceipt(RecordRuntimeReceiptRequest) returns (RecordRuntimeReceiptResponse);
  rpc EndRuntime(EndRuntimeRequest) returns (EndRuntimeResponse);
  rpc RecordRuntimeUsage(RecordRuntimeUsageRequest) returns (RecordRuntimeUsageResponse);
  rpc ReadRuntimeKnowledge(ReadRuntimeKnowledgeRequest) returns (ReadRuntimeKnowledgeResponse);
}

// Worker-only commands; the API derives fields and recipient from the pinned
// publication and verifies the live conversation/session on every operation.
message CommandFormCollectionRequest {
  option (buf.validate.message).cel = {
    id: "form_command.original_deadline"
    message: "create must preserve the original creating-checkpoint deadline"
    expression: "this.action != 'create' || has(this.expires_at)"
  };
  string action = 1 [(buf.validate.field).string = {in: ["create", "poll", "cancel", "ack"]}];
  string conversation_id = 2 [(buf.validate.field).string = {min_len: 1 max_len: 128}];
  string session_id = 3 [(buf.validate.field).string = {min_len: 1 max_len: 128}];
  string published_id = 4 [(buf.validate.field).string = {min_len: 1 max_len: 128}];
  string transition_id = 5 [(buf.validate.field).string = {min_len: 1 max_len: 256}];
  // Generated before create, reused for retries, cancellation and acknowledgement.
  string request_id = 6 [(buf.validate.field).string.uuid = true];
  RuntimeAuthorization owner = 7 [(buf.validate.field).required = true];
  optional uint32 consumption_revision = 8 [(buf.validate.field).uint32.gt = 0];
  optional string expires_at = 9 [(buf.validate.field).string = {min_len: 1 max_len: 64}];
}

message CommandFormCollectionResponse {
  option (buf.validate.message).cel = {
    id: "form_response.absence"
    message: "authoritative absence has no fabricated delivery or expiry; existing requests have both"
    expression: "this.status == 'not_found' ? (!has(this.delivery) && !has(this.expires_at) && this.values.size() == 0 && !has(this.provider_acceptance)) : (has(this.delivery) && has(this.expires_at))"
  };
  string request_id = 1 [(buf.validate.field).string.uuid = true];
  // Only positive SQL absence under current authorization proves no dispatch
  // intent exists; dependency failure, erasure and RPC 404 are not this status.
  string status = 2 [(buf.validate.field).string = {in: ["not_found", "prepared", "sending", "waiting", "send_uncertain", "completed", "applied", "expired", "cancelled", "failed"]}];
  optional string delivery = 3 [(buf.validate.field).string = {in: ["preview", "alimtalk"]}];
  optional string expires_at = 4 [(buf.validate.field).string = {min_len: 1 max_len: 64}];
  // Sensitive: worker only. Never include in model messages or lifecycle events.
  map<string, string> values = 5;
  string failure_code = 6 [(buf.validate.field).string.max_len = 64];
  RuntimeFormProviderAcceptance provider_acceptance = 7;
}

message RuntimeFormProviderAcceptance {
  string provider = 1 [(buf.validate.field).string.const = "wideshot"];
  string send_code = 2 [(buf.validate.field).string = {min_len: 1 max_len: 256}];
  string status = 3 [(buf.validate.field).string.const = "accepted"];
}

message BootstrapRequest {
  oneof admission {
    option (buf.validate.oneof).required = true;
    string webrtc_ticket = 1 [(buf.validate.field).string.min_len = 1];
    SipBootstrapContext sip = 2;
  }
}

message SipBootstrapContext {
  string job_id = 1 [(buf.validate.field).string.min_len = 1];
  string dispatch_id = 2 [(buf.validate.field).string.min_len = 1];
  string room_name = 3 [(buf.validate.field).string.min_len = 1];
  string participant_identity = 4 [(buf.validate.field).string.min_len = 1];
  string trunk_id = 5 [(buf.validate.field).string.min_len = 1];
  string trunk_phone_number = 6 [(buf.validate.field).string.min_len = 1];
  string call_id_full = 7 [(buf.validate.field).string.min_len = 1];
  optional string phone_number = 8 [(buf.validate.field).string.min_len = 1];
}

// Publication pins are immutable. Main bootstrap uses a prepared initial attempt;
// the API verifies its purpose, original admitted SQL binding and native assignment.
// Recovery uses RecoverRuntime rather than treating bootstrap as a recovery alias.
message BootstrapPublishedRequest {
  option (buf.validate.message).cel = {
    id: "bootstrap.runtime_authority"
    message: "main bootstrap requires its prepared attempt; private helpers forbid transport admission"
    expression: "has(this.attempt_authorization) || (has(this.helper_authorization) && !has(this.admission))"
  };
  // Optional original ticket or complete SIP transport evidence. A prepared main
  // attempt may omit it; omission never waives API admission or the four pins.
  BootstrapRequest admission = 1;
  string conversation_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string session_id = 3 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string published_id = 4 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string contract_revision = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {in: ["execution-publication-2026-09-04-r1", "execution-publication-2026-09-15-r2"]}
  ];
  // Optional original worker job correlation; never a participant, admission or
  // substitute for the required publication pins and private attempt authority.
  optional string worker_job_id = 6 [(buf.validate.field).string = {min_len: 1 max_len: 256}];
  oneof authority {
    option (buf.validate.oneof).required = true;
    RuntimeAttemptAuthorization attempt_authorization = 7;
    RuntimeHelperAuthorization helper_authorization = 8;
  }
}

message BootstrapPublishedResponse {
  option (buf.validate.message).oneof = {
    fields: ["voice_runtime", "text_runtime"]
    required: true
  };
  option (buf.validate.message).cel = {
    id: "published_bootstrap.execution_purpose"
    message: "main bootstrap requires its publication graph and variables; a private SIP helper requires only its original helper and speech runtimes"
    expression: "has(this.runtime_lease) && ((has(this.runtime_lease.authorization) && has(this.agent) && has(this.prompt_variables) && !has(this.helper_bootstrap) && !has(this.helper_checkpoint)) || (has(this.runtime_lease.helper_authorization) && has(this.helper_bootstrap) && has(this.voice_runtime) && !has(this.agent) && !has(this.prompt_variables) && this.helper_bootstrap.transfer_attempt_id == this.runtime_lease.helper_authorization.transfer_attempt_id))"
  };

  string contract_revision = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {in: ["execution-publication-2026-09-04-r1", "execution-publication-2026-09-15-r2"]}
  ];
  string conversation_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string session_id = 3 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string published_id = 4 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Authoritative admitted account owner, used to fence late worker storage writes.
  string user_id = 11 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];

  reserved 9, 10;
  reserved "transfer_capability", "llm_audit_capability";

  SessionPromptVariableBag prompt_variables = 6;
  PublishedAgentExecution agent = 5;
  oneof runtime {
    option (buf.validate.oneof).required = true;
    CallRuntimeSnapshot voice_runtime = 7;
    TextRuntimeSnapshot text_runtime = 8;
  }

  RuntimeLease runtime_lease = 12 [(buf.validate.field).required = true];
  RuntimeCheckpoint helper_checkpoint = 13;
  RuntimeTransferHelperBootstrap helper_bootstrap = 14;
}


// Terminal delivery preserves the original request correlation. Current control
// and original-execution receipt authority live on their distinct RPC envelopes.
message LlmAuditRequestContext {
  reserved 1;
  reserved "capability";
  string request_attempt_id = 2 [(buf.validate.field).string = {min_len: 1 max_len: 128}];
  string logical_request_id = 3 [(buf.validate.field).string = {min_len: 1 max_len: 128}];
  uint32 attempt_sequence = 4 [(buf.validate.field).uint32 = {gte: 1 lte: 100}];
  string node_id = 5 [(buf.validate.field).string = {min_len: 1 max_len: 256}];
  string agent_runtime_id = 6 [(buf.validate.field).string = {min_len: 1 max_len: 256}];
  optional string task_run_id = 7 [(buf.validate.field).string = {min_len: 1 max_len: 256}];
  string role = 8 [(buf.validate.field).string = {in: ["master", "worker", "handoff", "agent"]}];
  string requested_model = 9 [(buf.validate.field).string = {min_len: 1 max_len: 512}];
  // Kept separate from the model so historical costs cannot change after rerouting.
  optional string provider = 10 [(buf.validate.field).string = {in: ["openai", "openrouter"]}];
}

message RecordLlmRequestStartedRequest {
  LlmAuditRequestContext request = 1 [(buf.validate.field).required = true];
  oneof authority {
    option (buf.validate.oneof).required = true;
    RuntimeAuthorization owner = 2;
    RuntimeHelperAuthorization helper_authorization = 3;
  }
}

message RecordLlmRequestStartedResponse {
  string request_attempt_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 128}];
  bool recorded = 2;
}

message LlmAuditUsage {
  optional uint64 input_tokens = 1;
  optional uint64 output_tokens = 2;
  optional uint64 cached_input_tokens = 3;
  optional uint64 cache_write_tokens = 4;
  optional uint64 reasoning_tokens = 5;
  // Decimal string preserves provider cost precision across protobuf/JSON.
  optional string reported_cost_usd = 6 [(buf.validate.field).string = {max_len: 64 pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?(?:[eE][+-]?[0-9]+)?$"}];
  // Provider-specific numeric fields after API allowlist validation. This is
  // never a provider response body and must contain only numeric values.
  optional string provider_usage_json = 7 [(buf.validate.field).string = {max_bytes: 4000}];
}

message RecordLlmRequestTerminalRequest {
  LlmAuditRequestContext request = 1 [(buf.validate.field).required = true];
  string status = 2 [(buf.validate.field).string = {in: ["completed", "cancelled", "error"]}];
  optional uint32 http_status = 3 [(buf.validate.field).uint32 = {gte: 100 lte: 599}];
  optional string actual_model = 4 [(buf.validate.field).string = {min_len: 1 max_len: 512}];
  optional string provider_request_id = 5 [(buf.validate.field).string = {min_len: 1 max_len: 512}];
  optional LlmAuditUsage usage = 6;
  optional string error_code = 7 [(buf.validate.field).string = {min_len: 1 max_len: 128}];
  RuntimeReceiptAuthorization receipt_authorization = 8 [(buf.validate.field).required = true];
}

message RecordLlmRequestTerminalResponse {
  string request_attempt_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 128}];
  bool recorded = 2;
  bool duplicate = 3;
}

// Prompt variables shared by every Agent node for the lifetime of one call.
message SessionPromptVariableBag {
  option (buf.validate.message).cel = {
    id: "session_prompt_variable_bag.system_names_unique"
    message: "system prompt variable names must be unique"
    expression: "this.system.map(variable, variable.name).unique()"
  };
  option (buf.validate.message).cel = {
    id: "session_prompt_variable_bag.user_names_unique"
    message: "user prompt variable names must be unique"
    expression: "this.user.map(variable, variable.name).unique()"
  };
  option (buf.validate.message).cel = {
    id: "session_prompt_variable_bag.user_names_not_reserved"
    message: "user prompt variable name is reserved"
    expression: "this.user.all(variable, !(variable.name == 'customer' || variable.name == 'agent' || variable.name == 'conversation' || variable.name.startsWith('customer.') || variable.name.startsWith('agent.') || variable.name.startsWith('conversation.') || variable.name in ['now', 'date', 'time', 'month', 'day', 'year', 'date_iso', 'time_24h', 'datetime_iso']))"
  };

  repeated SessionPromptVariable system = 1 [(buf.validate.field).repeated = {max_items: 50}];
  repeated SessionPromptVariable user = 2 [(buf.validate.field).repeated = {max_items: 50}];
}

message SessionPromptVariable {
  string name = 1 [(buf.validate.field).string = {min_len: 1 max_bytes: 64 pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$"}];
  oneof value {
    option (buf.validate.oneof).required = true;
    string string_value = 2 [(buf.validate.field).string.max_bytes = 1000];
    double number_value = 3;
    bool boolean_value = 4;
  }
}

message PublishedAgentExecution {
  option (buf.validate.message).oneof = {
    fields: ["supervisor", "handoff"]
    required: true
  };
  option (buf.validate.message).cel = {
    id: "published_agent_execution.mode_snapshot"
    message: "mode must match the selected publication topology"
    expression: "(this.mode == 1 && has(this.supervisor)) || (this.mode == 2 && has(this.handoff))"
  };

  AgentMode mode = 1 [(buf.validate.field).required = true, (buf.validate.field).enum = {defined_only: true not_in: 0}];
  repeated PublishedAgentNodeRuntime node_runtimes = 2 [(buf.validate.field).repeated.min_items = 1];
  PublishedSupervisorSnapshot supervisor = 3;
  PublishedHandoffSnapshot handoff = 4;
  AgentPromptConfigSnapshot prompt_config = 5;
}

message AgentPromptConfigSnapshot {
  uint32 revision = 1 [(buf.validate.field).uint32.gt = 0];
  string system_guardrail = 2 [(buf.validate.field).string = {min_len: 1 max_len: 16000 pattern: "\\S"}];
  string crew_system_context = 3 [(buf.validate.field).string = {min_len: 1 max_len: 16000 pattern: "\\S"}];
  string handoff_context = 4 [(buf.validate.field).string = {min_len: 1 max_len: 16000 pattern: "\\S"}];
  string supervisor_context = 5 [(buf.validate.field).string = {min_len: 1 max_len: 16000 pattern: "\\S"}];
  string specialist_context = 6 [(buf.validate.field).string = {min_len: 1 max_len: 16000 pattern: "\\S"}];
  string voice_rules = 7 [(buf.validate.field).string = {min_len: 1 max_len: 16000 pattern: "\\S"}];
  string dtmf_rules = 8 [(buf.validate.field).string = {min_len: 1 max_len: 16000 pattern: "\\S"}];
}

// Agent nodes expose the optional start greeting alongside the raw system prompt.
// It is only played for the publication's primary start node by the runtime.
message PublishedAgentNodeRuntime {
  string node_id = 1 [(buf.validate.field).string.min_len = 1];
  LlmRuntime llm_worker = 2 [(buf.validate.field).required = true];
  AgentInstructions instructions = 3 [(buf.validate.field).required = true];
  ContextPolicy context_policy = 4 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
  repeated NodeToolMetadata tools = 5;
  repeated McpServerRuntime mcp_servers = 6;
  repeated ApiToolRuntime api_tool_runtimes = 7;
  repeated A2aToolRuntime a2a_tool_runtimes = 8;
  repeated BuiltInTool built_in_tools = 9;
  string knowledge_revision_id = 10;
  reserved 11;
  reserved "knowledge_retrieval_capability";
  string knowledge_function_name = 12;
  string knowledge_description = 13;
  repeated KnowledgeToolRuntime knowledge_tool_runtimes = 14;
  InlineAuthoringOptions authoring = 15;
  optional string display_name = 16 [(buf.validate.field).string = {min_len: 1 pattern: "\\S"}];
  optional string greeting = 17 [(buf.validate.field).string.max_len = 4000];
  optional string knowledge_tool_reference = 18 [(buf.validate.field).string = {min_len: 1 max_len: 256}];
}

// Optional so older publications retain provider defaults.
message InlineAuthoringOptions {
  NodeModelSettings model = 1;
  repeated NodeToolBinding tool_bindings = 2 [(buf.validate.field).repeated.max_items = 30];
}

message NodeModelSettings {
  optional double temperature = 1 [(buf.validate.field).double = {gte: 0, lte: 2}];
  optional int32 max_tokens = 2 [(buf.validate.field).int32 = {gte: 1, lte: 4096}];
  optional string reasoning_effort = 3 [(buf.validate.field).string = {in: ["low", "medium", "high"]}];
}

message NodeToolBinding {
  string tool_id = 1 [(buf.validate.field).string.min_len = 1];
  string parameter = 2 [(buf.validate.field).string.min_len = 1];
  string variable = 3 [(buf.validate.field).string.min_len = 1];
  string target = 4 [(buf.validate.field).string = {in: ["argument", "template"]}];
}

message PublishedSupervisorSnapshot {
  string supervisor_node_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated PublishedSupervisorSpecialist specialists = 2;
}

message PublishedSupervisorSpecialist {
  option (buf.validate.message).cel = {
    id: "published_supervisor_specialist.context_policy_allowed"
    message: "supervisor context policy must be none or conversation"
    expression: "this.context_policy == 1 || this.context_policy == 2"
  };

  string relation_id = 1 [(buf.validate.field).string.min_len = 1];
  string target_node_id = 2 [(buf.validate.field).string.min_len = 1];
  string route_description = 3 [(buf.validate.field).string.min_len = 1];
  ContextPolicy context_policy = 4 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
}

message PublishedHandoffSnapshot {
  string entry_node_id = 1 [(buf.validate.field).string.min_len = 1];
  uint32 max_handoff_depth = 2 [(buf.validate.field).uint32.gt = 0];
  repeated PublishedHandoffRoute routes = 3;
}

message PublishedHandoffRoute {
  option (buf.validate.message).cel = {
    id: "published_handoff_route.context_policy_allowed"
    message: "handoff context policy must be none, recent, all, user_and_assistant_messages, or previous_assistant_messages"
    expression: "this.context_policy == 1 || this.context_policy == 3 || this.context_policy == 4 || this.context_policy == 5 || this.context_policy == 6"
  };
  option (buf.validate.message).cel = {
    id: "published_handoff_route.max_messages_scope"
    message: "max_messages is only valid for recent context and must be between 1 and 100"
    expression: "!has(this.max_messages) || (this.context_policy == 3 && this.max_messages >= 1 && this.max_messages <= 100)"
  };
  option (buf.validate.message).cel = {
    id: "published_handoff_route.parameter_names_unique"
    message: "handoff parameter names must be unique"
    expression: "this.parameters.map(parameter, parameter.name).unique()"
  };
  option (buf.validate.message).cel = {
    id: "published_handoff_route.start_message_source"
    message: "handoff route may use either announcement or request_start, but not both"
    expression: "this.announcement == '' || this.request_start == ''"
  };

  string transition_id = 1 [(buf.validate.field).string.min_len = 1];
  string source_node_id = 2 [(buf.validate.field).string.min_len = 1];
  string target_node_id = 3 [(buf.validate.field).string.min_len = 1];
  string routing_description = 4 [(buf.validate.field).string.min_len = 1];
  ContextPolicy context_policy = 5 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
  string announcement = 6 [deprecated = true];
  repeated HandoffParameter parameters = 7;
  string request_start = 8;
  optional string system_prompt = 9 [(buf.validate.field).string = {min_len: 1 pattern: "\\S"}];
  optional uint32 max_messages = 10 [(buf.validate.field).uint32 = {gte: 1 lte: 100}];
  ToolMessages tool_messages = 11;
}

enum HandoffParameterType {
  HANDOFF_PARAMETER_TYPE_UNSPECIFIED = 0;
  HANDOFF_PARAMETER_TYPE_STRING = 1;
  HANDOFF_PARAMETER_TYPE_NUMBER = 2;
  HANDOFF_PARAMETER_TYPE_BOOLEAN = 3;
}

message HandoffParameter {
  option (buf.validate.message).cel = {
    id: "handoff_parameter.collection_scope"
    message: "collection requires a required string parameter without enum values"
    expression: "!has(this.collection) || (this.type == 1 && this.required && size(this.string_enum) == 0 && size(this.number_enum) == 0 && size(this.boolean_enum) == 0)"
  };
  option (buf.validate.message).cel = {
    id: "handoff_parameter.enum_matches_type"
    message: "only the enum values matching type may be populated"
    expression: "(this.type == 1 && size(this.number_enum) == 0 && size(this.boolean_enum) == 0) || (this.type == 2 && size(this.string_enum) == 0 && size(this.boolean_enum) == 0) || (this.type == 3 && size(this.string_enum) == 0 && size(this.number_enum) == 0)"
  };

  string name = 1 [(buf.validate.field).string.min_len = 1];
  HandoffParameterType type = 2 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
  string description = 3;
  bool required = 4;
  repeated string string_enum = 5 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
  repeated double number_enum = 6 [(buf.validate.field).repeated.unique = true];
  repeated bool boolean_enum = 7 [(buf.validate.field).repeated.unique = true];
  // Missing collection preserves legacy LLM-extracted handoff arguments.
  HandoffParameterCollection collection = 8;
}

// The runtime collects these values before activating the edge target.
message HandoffParameterCollection {
  option (buf.validate.message).cel = {
    id: "handoff_collection.format_scope"
    message: "DTMF has no form format; web forms have no keypad confirmation"
    expression: "(this.input == 'dtmf' && !has(this.format)) || (this.input == 'web_form' && !this.confirm && (!has(this.format) || this.format == 'digits' || (this.format == 'phone' && this.digits == 11u) || (this.format == 'birthdate' && this.digits == 8u)))"
  };
  string input = 1 [(buf.validate.field).string = {in: ["dtmf", "web_form"]}];
  uint32 digits = 2 [(buf.validate.field).uint32 = {gte: 1 lte: 32}];
  string prompt = 3 [(buf.validate.field).string = {min_len: 1 max_len: 1000 pattern: "\\S"}];
  // Overall deadline, including retries and optional confirmation.
  uint32 timeout_seconds = 4 [(buf.validate.field).uint32 = {gte: 5 lte: 120}];
  bool confirm = 5;
  optional string format = 6 [(buf.validate.field).string = {in: ["digits", "phone", "birthdate"]}];
}

message TextRuntimeSnapshot {
  string transport = 1 [(buf.validate.field).string.const = "text_stream"];
  string room_name = 2 [(buf.validate.field).string.min_len = 1];
  string participant_identity = 3 [(buf.validate.field).string.min_len = 1];
  uint32 idle_timeout_seconds = 4 [(buf.validate.field).uint32.gt = 0];
  uint32 max_session_duration_seconds = 5 [(buf.validate.field).uint32.gt = 0];
}

message CallRuntimeSnapshot {
  SttRuntime stt = 1 [(buf.validate.field).required = true];
  TtsRuntime tts = 2 [(buf.validate.field).required = true];
  BackgroundAudioRuntime background_audio = 3 [(buf.validate.field).required = true];
  DtmfInputRuntime dtmf = 4 [(buf.validate.field).required = true];
  TransportRuntime transport = 5 [(buf.validate.field).required = true];
  VadRuntime vad = 6 [(buf.validate.field).required = true];
  SpeechPolicyRuntime speech_policy = 7 [(buf.validate.field).required = true];
  CallLimitsRuntime limits = 8 [(buf.validate.field).required = true];
  ConversationFillerRuntime conversation_filler = 9;
  ConversationControlRuntime conversation_control = 10 [(buf.validate.field).required = true];
}

message ConversationControlRuntime {
  optional string end_call_message = 1 [(buf.validate.field).string = {min_len: 1 max_len: 1000}];
  repeated string end_call_phrases = 2 [(buf.validate.field).repeated.items.string = {min_len: 2 max_len: 140}];
  repeated TimeElapsedActionRuntime time_elapsed_actions = 3;
  // Absent on legacy sessions or when idle prompting is disabled.
  IdleMessageRuntime idle_message = 4;
}

message IdleMessageRuntime {
  string mode = 1 [(buf.validate.field).string = {in: ["exact", "prompt"]}];
  // Exact mode preserves wording and whitespace. Prompt mode supplies generation instructions.
  string message = 2 [(buf.validate.field).string = {min_len: 1 max_len: 1000 pattern: "\\S"}];
  uint32 timeout_seconds = 3 [(buf.validate.field).uint32 = {gte: 1 lte: 1000}];
  uint32 max_count = 4 [(buf.validate.field).uint32 = {gte: 1 lte: 10}];
  bool reset_on_user_speech = 5;
}

message TimeElapsedActionRuntime {
  uint32 at_seconds = 1 [(buf.validate.field).uint32 = {gte: 1 lte: 3600}];
  oneof action {
    option (buf.validate.oneof).required = true;
    string say = 2 [(buf.validate.field).string = {min_len: 1 max_len: 1000}];
    EndCallActionRuntime end_call = 3;
  }
