syntax = "proto3";

package port.api.v1;

import "buf/validate/validate.proto";
import "port/api/v1/voice_runtime.proto";

option go_package = "github.com/kyh0703/port-contracts/gen/go/port/api/v1;apiv1";

// AgentSessionService is the worker-only API boundary for LiveKit jobs.
service AgentSessionService {
  rpc Bootstrap(BootstrapRequest) returns (BootstrapResponse);
}

message BootstrapRequest {
  oneof admission {
    string webrtc_ticket = 1 [(buf.validate.field).string.min_len = 1];
    SipBootstrapContext sip = 2;
  }
}

message SipBootstrapContext {
  string job_id = 1 [(buf.validate.field).string.min_len = 1];
  string dispatch_id = 2 [(buf.validate.field).string.min_len = 1];
  string room_name = 3 [(buf.validate.field).string.min_len = 1];
  string participant_identity = 4 [(buf.validate.field).string.min_len = 1];
  string trunk_id = 5 [(buf.validate.field).string.min_len = 1];
  string trunk_phone_number = 6 [(buf.validate.field).string.min_len = 1];
  string call_id_full = 7 [(buf.validate.field).string.min_len = 1];
}

message BootstrapResponse {
  string conversation_id = 1 [(buf.validate.field).string.min_len = 1];
  string session_id = 2 [(buf.validate.field).string.min_len = 1];
  string source = 3 [(buf.validate.field).string.in = "webrtc", (buf.validate.field).string.in = "sip", (buf.validate.field).string.in = "text_stream"];
  string room_name = 4 [(buf.validate.field).string.min_len = 1];
  string agent_tool_snapshot_id = 5 [(buf.validate.field).string.min_len = 1];
  SttRuntime stt = 6 [(buf.validate.field).required = true];
  LlmRuntime llm = 7 [(buf.validate.field).required = true];
  TtsRuntime tts = 8 [(buf.validate.field).required = true];
  repeated McpServerRuntime mcp_servers = 9;
  string agent_id = 10 [(buf.validate.field).string.min_len = 1];
  // 11 and 12 were flow_id / flow_version_id, shipped in 1.2.3. The Flow layer
  // is gone, and reusing those numbers for other types would misparse on any
  // client still running that release.
  reserved 11, 12;
  reserved "flow_id", "flow_version_id";
  // Specialist/workflow fields shipped in earlier releases. Keep their wire
  // numbers unavailable; the supervisor/worker snapshot starts at 18.
  reserved 13, 14, 15, 16, 17;
  reserved "persona", "specialists", "global_actions", "agent_version_id", "workflow";

  string supervisor_id = 18 [(buf.validate.field).string.min_len = 1];
  string supervisor_version_id = 19 [(buf.validate.field).string.min_len = 1];
  SupervisorPersona supervisor_persona = 20 [(buf.validate.field).required = true];
  SupervisorConfig supervisor_config = 21 [(buf.validate.field).required = true];
  repeated WorkerSnapshot workers = 22;
  CanvasSnapshot canvas = 23 [(buf.validate.field).required = true];
  repeated WorkerToolSnapshot worker_tool_snapshots = 24;
  string bootstrap_snapshot_id = 25 [(buf.validate.field).string.min_len = 1];
  repeated ApiToolRuntime api_tool_runtimes = 26;
  OrchestrationGraphSnapshot orchestration_graph = 27;
}

message OrchestrationGraphSnapshot {
  string snapshot_id = 1 [(buf.validate.field).string.min_len = 1];
  string version_id = 2 [(buf.validate.field).string.min_len = 1];
  string schema_version = 3 [(buf.validate.field).string.const = "agent.orchestration.v1"];
  string entry_node_id = 4 [(buf.validate.field).string.min_len = 1];
  uint32 max_handoff_depth = 5 [(buf.validate.field).uint32.gt = 0];
  repeated OrchestrationNode nodes = 6;
  repeated OrchestrationTransition transitions = 7;
  repeated NodeToolSnapshot node_tool_snapshots = 8;
}

message OrchestrationNode {
  string node_id = 1 [(buf.validate.field).string.min_len = 1];
  NodeKind kind = 2 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
  string parent_node_id = 3;
  CanvasPosition position = 4 [(buf.validate.field).required = true];
  CanvasSize size = 5 [(buf.validate.field).required = true];
  oneof payload {
    OrchestrationAgent agent = 6;
    OrchestrationTask task = 7;
    OrchestrationGroup group = 8;
  }
}

message OrchestrationAgent {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  string agent_version_id = 2 [(buf.validate.field).string.min_len = 1];
  OrchestrationAgentPersona persona = 3 [(buf.validate.field).required = true];
  OrchestrationExecutionProfile execution_profile = 4 [(buf.validate.field).required = true];
  string tool_snapshot_id = 5 [(buf.validate.field).string.min_len = 1];
}

message OrchestrationTask {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string instructions = 2 [(buf.validate.field).string.min_len = 1];
  string completion_instructions = 3 [(buf.validate.field).string.min_len = 1];
  OrchestrationExecutionProfile execution_profile = 4;
  string tool_snapshot_id = 5 [(buf.validate.field).string.min_len = 1];
}

message OrchestrationGroup {
  string label = 1;
}

message OrchestrationAgentPersona {
  string display_name = 1 [(buf.validate.field).string.min_len = 1];
  string system_prompt = 2 [(buf.validate.field).string.min_len = 1];
  string greeting = 3;
}

message OrchestrationExecutionProfile {
  string llm_model = 1;
  string tts_model = 2;
  string voice_id = 3;
  string language = 4;
}

message NodeToolSnapshot {
  string snapshot_id = 1 [(buf.validate.field).string.min_len = 1];
  string version_id = 2 [(buf.validate.field).string.min_len = 1];
  string node_id = 3 [(buf.validate.field).string.min_len = 1];
  repeated NodeToolMetadata tools = 4;
}

message NodeToolMetadata {
  string tool_id = 1 [(buf.validate.field).string.min_len = 1];
  string kind = 2 [
    (buf.validate.field).string.in = "mcp",
    (buf.validate.field).string.in = "api"
  ];
  string name = 3 [(buf.validate.field).string.min_len = 1];
  string description = 4;
  oneof metadata {
    McpToolMetadata mcp = 5;
    ApiToolMetadata api = 6;
  }
}

message OrchestrationTransition {
  string transition_id = 1 [(buf.validate.field).string.min_len = 1];
  string source_node_id = 2 [(buf.validate.field).string.min_len = 1];
  string target_node_id = 3 [(buf.validate.field).string.min_len = 1];
  TransitionKind kind = 4 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
  string description = 5 [(buf.validate.field).string.min_len = 1];
  ContextPolicy context_policy = 6 [(buf.validate.field).enum = {defined_only: true not_in: 0}];
  string announcement = 7;
}

enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_AGENT = 1;
  NODE_KIND_TASK = 2;
  NODE_KIND_GROUP = 3;
}

enum TransitionKind {
  TRANSITION_KIND_UNSPECIFIED = 0;
  TRANSITION_KIND_DELEGATE = 1;
  TRANSITION_KIND_HANDOFF = 2;
}

enum ContextPolicy {
  CONTEXT_POLICY_UNSPECIFIED = 0;
  CONTEXT_POLICY_NONE = 1;
  CONTEXT_POLICY_CONVERSATION = 2;
}

message SupervisorPersona {
  string display_name = 1 [(buf.validate.field).string.min_len = 1];
  string system_prompt = 2 [(buf.validate.field).string.min_len = 1];
  string voice_id = 3;
  string language = 4;
}

message SupervisorConfig {
  string routing_instructions = 1;
  uint32 max_handoff_depth = 2;
  AgentGlobalActions global_actions = 3;
}

// Frozen at publish time. The worker uses routing_text to decide when a
// supervisor should hand a turn to this worker; description is display text.
message WorkerSnapshot {
  string worker_id = 1 [(buf.validate.field).string.min_len = 1];
  string version_id = 2 [(buf.validate.field).string.min_len = 1];
  string description = 3;
  string routing_text = 4 [(buf.validate.field).string.min_len = 1];
  WorkerPersona persona = 5 [(buf.validate.field).required = true];
  string role = 6 [(buf.validate.field).string.in = "worker"];
  string runtime_identity = 7 [(buf.validate.field).string.min_len = 1];
  string tool_snapshot_id = 8;
}

message WorkerPersona {
  string display_name = 1 [(buf.validate.field).string.min_len = 1];
  string system_prompt = 2 [(buf.validate.field).string.min_len = 1];
  string greeting = 3;
  string voice_id = 4;
  string language = 5;
}

// Immutable xyflow placement snapshot. parent_node_id points to another group
// node, and an empty value means the node is at the canvas root.
message CanvasSnapshot {
  string snapshot_id = 1 [(buf.validate.field).string.min_len = 1];
  string version_id = 2 [(buf.validate.field).string.min_len = 1];
  string schema_version = 3 [(buf.validate.field).string.min_len = 1];
  repeated CanvasNodeSnapshot nodes = 4;
}

message CanvasNodeSnapshot {
  string node_id = 1 [(buf.validate.field).string.min_len = 1];
  string parent_node_id = 2;
  CanvasPosition position = 3 [(buf.validate.field).required = true];
  CanvasSize size = 4 [(buf.validate.field).required = true];
  bool is_entry = 5;
  oneof placement {
    CanvasGroupPlacement group = 6;
    CanvasAgentPlacement agent = 7;
  }
}

message CanvasGroupPlacement {
  string label = 1;
}

message CanvasAgentPlacement {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message CanvasPosition {
  double x = 1;
  double y = 2;
}

message CanvasSize {
  double width = 1;
  double height = 2;
}

// Tool metadata is scoped to a Worker. URLs and schemas describe the mounted
// tool; credentials and provider secrets must never be included in this
// snapshot.
message WorkerToolSnapshot {
  string snapshot_id = 1 [(buf.validate.field).string.min_len = 1];
  string version_id = 2 [(buf.validate.field).string.min_len = 1];
  string worker_id = 3 [(buf.validate.field).string.min_len = 1];
  repeated WorkerToolMetadata tools = 4;
}

message WorkerToolMetadata {
  string tool_id = 1 [(buf.validate.field).string.min_len = 1];
  string kind = 2 [
    (buf.validate.field).string.in = "mcp",
    (buf.validate.field).string.in = "api"
  ];
  string name = 3 [(buf.validate.field).string.min_len = 1];
  string description = 4;
  oneof metadata {
    McpToolMetadata mcp = 5;
    ApiToolMetadata api = 6;
  }
}

message McpToolMetadata {
  string server_name = 1 [(buf.validate.field).string.min_len = 1];
  string transport = 2 [
    (buf.validate.field).string.in = "sse",
    (buf.validate.field).string.in = "streamable-http"
  ];
  string url = 3 [(buf.validate.field).string.min_len = 1];
}

message ApiToolMetadata {
  string method = 1 [(buf.validate.field).string.min_len = 1];
  string url = 2 [(buf.validate.field).string.min_len = 1];
  string request_schema_json = 3;
  string response_schema_json = 4;
}

// Short-lived execution credentials for API tools. These are not part of the
// immutable WorkerToolSnapshot and are scoped to the bootstrap lease.
message ApiToolRuntime {
  string tool_id = 1 [(buf.validate.field).string.min_len = 1];
  map<string, string> headers = 2;
}

// Mounted as AgentSession-level tools so they stay callable while a Worker
// holds the turn — a caller can ask for a human or hang up mid-step.
message AgentGlobalActions {
  TransferToHumanAction transfer_to_human = 1;
  EndCallAction end_call = 2;
}

message TransferToHumanAction {
  bool enabled = 1;
  // Empty when disabled. SIP destination for the warm transfer.
  string sip_call_to = 2;
  string hold_phrase = 3;
  int32 ringing_timeout_ms = 4;
}

message EndCallAction {
  bool enabled = 1;
  string closing_phrase = 2;
  // Ask once before hanging up instead of ending immediately.
  bool confirm = 3;
}

message McpServerRuntime {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string transport = 2 [(buf.validate.field).string.in = "sse", (buf.validate.field).string.in = "streamable-http"];
  string url = 3 [(buf.validate.field).string.min_len = 1];
  map<string, string> headers = 4;
}
